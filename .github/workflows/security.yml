# Security Scanning — calls eSolia/devkit's reusable secrets-and-sast workflow.
# Same-org call (eSolia → eSolia), so no vendoring needed.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets & SAST
    uses: eSolia/devkit/.github/workflows/secrets-and-sast.yml@main
    with:
      source-paths: 'mod.ts index.ts ui tokens utils assets'
      run-sbom: true
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

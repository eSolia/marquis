# ============================================================================
# Security Scanning — calls eSolia/devkit's shared reusable workflow
# ============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secrets & SAST
    uses: eSolia/devkit/.github/workflows/secrets-and-sast.yml@main
    with:
      source-paths: 'mod.ts index.ts ui tokens utils assets'
      run-sbom: true
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
